name: Build and release Audio8D
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every push is independent; never discard an earlier main run through concurrency.
jobs:
  packages:
    env:
      AUDIO8D_SIGNING_ENABLED: ${{ vars.AUDIO8D_SIGNING_ENABLED }}
      AUDIO8D_SIGNING_PROVIDER: ${{ vars.AUDIO8D_SIGNING_PROVIDER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            python: '3.12'
          - os: ubuntu-22.04
            platform: linux-x86_64
            python: '3.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes python3-tk xvfb
      - name: Install development dependencies
        run: python -m pip install -e ".[gui,dev]" -r packaging/requirements-build.txt
      - name: Repository and publication policy checks
        shell: bash
        run: |
          set -euo pipefail
          python packaging/sign_release.py check-provider
          python .github/scripts/check_repository.py
          python -m unittest discover -s .github/scripts -p test_publish_main_release.py -v
      - name: Build and verify native application package
        run: python packaging/build_release.py
      - name: Expose the verified Linux FFmpeg to tests
        if: runner.os == 'Linux'
        shell: bash
        run: echo "$GITHUB_WORKSPACE/build/ffmpeg/linux-x86_64" >> "$GITHUB_PATH"
      - name: Windows converter and GUI tests
        if: runner.os == 'Windows'
        run: python -m pytest
      - name: Windows packaged GUI lifecycle regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          python packaging/gui_smoke.py "bin/Audio8D-$version-windows-x86_64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged GUI lifecycle regression failed' }
      - name: Linux converter and GUI tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m pytest
      - name: Stage only this platform's package
        shell: python
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          import hashlib, os, pathlib, re, shutil
          root = pathlib.Path('.')
          version = re.search(r'^version\s*=\s*"([^"]+)"', (root / 'pyproject.toml').read_text(), re.M)[1]
          package = root / 'bin' / f'Audio8D-{version}-{os.environ["PACKAGE_PLATFORM"]}.zip'
          if not package.is_file():
              raise SystemExit('The expected verified package is missing')
          staging = root / 'artifacts' / 'release'
          staging.mkdir(parents=True)
          shutil.copy2(package, staging / package.name)
          (staging / package.with_suffix('.sha256').name).write_text(
              f'{hashlib.sha256(package.read_bytes()).hexdigest()}  {package.name}\n', encoding='utf-8')
      - name: Retain packaged GUI regression evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audio8D-gui-lifecycle-evidence
          path: |
            artifacts/gui-smoke/**/summary.json
            artifacts/gui-smoke/**/result.json
            artifacts/gui-smoke/**/logs/*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audio8D-${{ matrix.platform }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 30
  sign-windows:
    needs: packages
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AUDIO8D_SIGNING_ENABLED == 'true' &&
      (vars.AUDIO8D_SIGNING_PROVIDER == '' || vars.AUDIO8D_SIGNING_PROVIDER == 'azure')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AUDIO8D_SIGNING_ENDPOINT: ${{ vars.AUDIO8D_SIGNING_ENDPOINT }}
      AUDIO8D_SIGNING_ACCOUNT: ${{ vars.AUDIO8D_SIGNING_ACCOUNT }}
      AUDIO8D_SIGNING_PROFILE: ${{ vars.AUDIO8D_SIGNING_PROFILE }}
      AUDIO8D_SIGNING_PUBLISHER: ${{ vars.AUDIO8D_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Require complete public-trust signing configuration
        shell: pwsh
        run: |
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AUDIO8D_SIGNING_ENDPOINT','AUDIO8D_SIGNING_ACCOUNT','AUDIO8D_SIGNING_PROFILE','AUDIO8D_SIGNING_PUBLISHER')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing variable: $name" }
          }
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            $parsed = [guid]::Empty
            if (-not [guid]::TryParse([Environment]::GetEnvironmentVariable($name), [ref]$parsed)) { throw "Invalid signing identity: $name" }
          }
          if ($env:AUDIO8D_SIGNING_ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$') { throw 'Unexpected Artifact Signing endpoint' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Audio8D-windows-x86_64
          path: artifacts/unsigned
      - name: Verify CRCs and stage the tested unsigned Windows package
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts/unsigned/*.zip)
          if ($zip.Count -ne 1) { throw 'Exactly one Windows ZIP required' }
          python packaging/sign_release.py stage $zip[0].FullName artifacts/signing-payload --checksum ([IO.Path]::ChangeExtension($zip[0].FullName, '.sha256'))
          if ($LASTEXITCODE -ne 0) { throw 'Signing input verification failed' }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Sign only the two Audio8D frontends
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AUDIO8D_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AUDIO8D_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AUDIO8D_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\signing-payload\Audio8D\Audio8D.exe
            ${{ github.workspace }}\artifacts\signing-payload\Audio8D\audio8d-cli.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify trusted signatures and unchanged PyInstaller content then repackage
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts/unsigned/*.zip)
          python packaging/sign_release.py finalize artifacts/signing-payload "artifacts/signed/$($zip[0].Name)" --publisher $env:AUDIO8D_SIGNING_PUBLISHER
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows package verification failed' }
      - name: Check the actual signed GUI after repackaging
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts/signed/*.zip)
          if ($zip.Count -ne 1) { throw 'Exactly one signed Windows ZIP required' }
          python packaging/gui_smoke.py $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Signed GUI lifecycle regression failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audio8D-windows-x86_64-signed
          path: |
            artifacts/signed/*.zip
            artifacts/signed/*.sha256
          if-no-files-found: error
          retention-days: 30
  sign-signpath:
    needs: packages
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.AUDIO8D_SIGNING_ENABLED == 'true' && vars.AUDIO8D_SIGNING_PROVIDER == 'signpath'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      AUDIO8D_SIGNING_PUBLISHER: ${{ vars.AUDIO8D_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Require approved SignPath identifiers and submitter token
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG','AUDIO8D_SIGNING_PUBLISHER','SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
          $organization = [guid]::Empty
          if (-not [guid]::TryParse($env:SIGNPATH_ORGANIZATION_ID, [ref]$organization)) { throw 'Invalid SignPath organization identifier' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Audio8D-windows-x86_64
          path: artifacts/unsigned
      - name: Verify package and export only the two original frontends
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts/unsigned/*.zip)
          if ($zip.Count -ne 1) { throw 'Exactly one Windows ZIP required' }
          python packaging/sign_release.py stage $zip[0].FullName artifacts/signing-payload --checksum ([IO.Path]::ChangeExtension($zip[0].FullName, '.sha256'))
          if ($LASTEXITCODE -ne 0) { throw 'Signing input verification failed' }
          python packaging/sign_release.py export-signpath artifacts/signing-payload artifacts/signpath-request
          if ($LASTEXITCODE -ne 0) { throw 'SignPath frontend export failed' }
      - name: Upload exact frontends for SignPath origin verification
        id: signpath-input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audio8D-signpath-request
          path: artifacts/signpath-request/
          if-no-files-found: error
          retention-days: 7
      - name: Request approved Foundation signing and wait for manual approval
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-input.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signpath-result
          skip-decompress: true
      - name: Import checked signed frontends and verify trusted signatures
        shell: pwsh
        run: |
          python packaging/sign_release.py import-signpath artifacts/signing-payload artifacts/signpath-result
          if ($LASTEXITCODE -ne 0) { throw 'SignPath result integrity check failed' }
          $zip = @(Get-ChildItem artifacts/unsigned/*.zip)
          python packaging/sign_release.py finalize artifacts/signing-payload "artifacts/signed/$($zip[0].Name)" --publisher $env:AUDIO8D_SIGNING_PUBLISHER
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows trust verification failed' }
      - name: Check the actual signed GUI after repackaging
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem artifacts/signed/*.zip)
          if ($zip.Count -ne 1) { throw 'Exactly one signed Windows ZIP required' }
          python packaging/gui_smoke.py $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Signed GUI lifecycle regression failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Audio8D-windows-x86_64-signed
          path: |
            artifacts/signed/*.zip
            artifacts/signed/*.sha256
          if-no-files-found: error
          retention-days: 30
  publish-main:
    needs: [packages, sign-windows, sign-signpath]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.packages.result == 'success' &&
      ((needs.sign-windows.result == 'success' && needs.sign-signpath.result == 'skipped') ||
      (needs.sign-signpath.result == 'success' && needs.sign-windows.result == 'skipped') ||
      (needs.sign-windows.result == 'skipped' && needs.sign-signpath.result == 'skipped' && vars.AUDIO8D_SIGNING_ENABLED != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Audio8D-linux-x86_64
          path: artifacts/main-download
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ (needs.sign-windows.result == 'success' || needs.sign-signpath.result == 'success') && 'Audio8D-windows-x86_64-signed' || 'Audio8D-windows-x86_64' }}
          path: artifacts/main-download
      - name: Publish both verified platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO8D_SIGNED_WINDOWS: ${{ (needs.sign-windows.result == 'success' || needs.sign-signpath.result == 'success') && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          signing_args=()
          if [[ "$AUDIO8D_SIGNED_WINDOWS" == 'true' ]]; then signing_args+=(--signed-windows); fi
          python .github/scripts/publish_main_release.py --project Audio8D --version "$version" "${signing_args[@]}" artifacts/main-download/*.zip
