# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/8d-audio-converter"
title: "Audio8D"
description: "FFmpeg-based 8D audio converter for Windows and Linux, with desktop and command-line interfaces and MP3, FLAC, WAV, M4A and Opus output."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "README.md"
    values:
      title: "Audio8D — 8D Audio Converter for Windows and Linux"
      description: "Create headphone-focused 8D audio with Audio8D, a Python and FFmpeg desktop app and CLI for Windows and Linux. Preview styles and export five audio formats."
  - scope:
      path: "THIRD-PARTY-NOTICES.md"
    values:
      title: "Third-party software in Audio8D"
      description: "Audio8D bundled dependency versions, license texts and FFmpeg source links for the desktop and command-line audio converter."

# Public documentation navigation and presentation.
repository: gcfernando/8d-audio-converter
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Audio & desktop"
